name: Offline research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      MEDICAL_RAG_LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,retrieval]'
      - run: python -m pytest
      - run: interactive-agent doctor
      - run: interactive-agent demo --output runs/ci-demo
      - run: interactive-agent report runs/ci-demo
      - run: python -m pip wheel --no-deps . --wheel-dir dist
