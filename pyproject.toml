[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-agent-research"
version = "0.1.0"
description = "Controlled experiments on clinical agent information gathering and handoff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.0", "langchain-core==1.4.0",
  "langchain-google-genai==4.2.2", "langsmith==0.8.3",
  "python-dotenv==1.2.2", "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
retrieval = ["neo4j==6.2.0", "faiss-cpu==1.13.2", "sentence-transformers==5.5.0"]

[project.scripts]
interactive-agent = "interactive_agent.cli:main"

[tool.setuptools.packages.find]
include = ["interactive_agent*", "graphrag*"]
exclude = ["graphrag.eval.external*"]
namespaces = false

[tool.setuptools.package-data]
"graphrag.eval" = ["specs/*.json", "specs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "graphrag"]
addopts = "-q"
